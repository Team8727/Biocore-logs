name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - index.html
      - "assets/**"
      - "data/**"
      - "config/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-pages.yml
